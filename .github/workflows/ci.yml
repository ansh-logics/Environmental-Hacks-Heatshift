name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @heatshift/shared build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build API and web bundles
        run: pnpm -r build

  docker:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
          - name: web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.file }} -t heatshift-${{ matrix.name }}:ci .

  smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for the API health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 5
          done
          docker compose logs api
          exit 1

      - name: Check seeded relief points are served
        run: |
          curl -fsS http://localhost:3000/api/v1/relief-points | grep -q '"demo":true'

      - name: Check the web shell is served
        run: curl -fsS http://localhost:5173/ | grep -q 'HeatShift'

      - name: Stop the stack
        if: always()
        run: docker compose down -v
