server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressed text is what makes this usable on slow mobile data.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # nginx's stock mime.types has no entry for .webmanifest, so installs would
  # otherwise see application/octet-stream. A server-level `types` block replaces
  # the inherited map, so the defaults have to be re-included alongside it.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  # Content-hashed bundles: cache hard. add_header does not inherit, so the
  # security headers are repeated wherever a location sets its own.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and manifest must always be revalidated.
  location ~* /(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Container health check target (used by docker-compose).
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # SPA fallback for React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
