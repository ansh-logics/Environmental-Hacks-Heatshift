# Hot-reload development stack:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Source is bind-mounted and each container's node_modules stays in an anonymous
# volume, so edits on the host restart Vite / tsx instantly.
#
# Prefer running the apps on the host and keep only the database in Docker?
#   docker compose up -d postgres
#   pnpm setup && pnpm db:migrate && pnpm db:seed && pnpm dev

name: heatshift

services:
  api:
    build:
      target: dev
    command: ['pnpm', '--filter', '@heatshift/api', 'dev']
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # Migrations and the demo seed still run when the dev server boots.
      MIGRATE_ON_BOOT: 'true'
      SEED_ON_BOOT: 'true'
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules

  web:
    build:
      target: dev
    command: ['pnpm', '--filter', '@heatshift/web', 'dev', '--host', '0.0.0.0']
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      # Vite also sees the repo-root .env through the bind mount; this keeps the
      # token working even when that file is absent. Empty = map fallback.
      VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
    ports:
      - '5173:5173'
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
